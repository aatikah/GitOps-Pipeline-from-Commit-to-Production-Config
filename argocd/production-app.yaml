apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aatikah/GitOps-Pipeline-from-Commit-to-Production-Config.git
    targetRevision: main
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: app-production
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
